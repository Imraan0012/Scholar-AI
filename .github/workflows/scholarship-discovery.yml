name: All-India Scholarship Discovery

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'

jobs:
  discover-scholarships:
    name: Run All-India Scholarship Discovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Spring Boot Discovery Endpoint with Cold-Start Resilience
        env:
          BACKEND_URL: ${{ secrets.PROD_API_URL || 'https://scholar-ai-l8uc.onrender.com' }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          echo "Starting All-India official scholarship discovery pipeline..."
          ENDPOINT="${BACKEND_URL}/api/admin/discovery/run"
          MAX_RETRIES=3
          RETRY_DELAY=15
          SUCCESS=0

          if [ -z "$SCHEDULER_SECRET" ]; then
            echo "::error::SCHEDULER_SECRET is not set in repository secrets."
            exit 1
          fi

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES: Calling discovery endpoint..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT" \
              -H "Content-Type: application/json" \
              -H "X-Scheduler-Secret: ${SCHEDULER_SECRET}" \
              --max-time 60)

            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n -e 's/^HTTP_STATUS://p')
            BODY=$(echo "$RESPONSE" | sed -e '/HTTP_STATUS:/d')

            echo "Response HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              # Validate JSON response structure
              IS_SUCCESS=$(echo "$BODY" | grep -o '"success":\s*true' || true)

              if [ -n "$IS_SUCCESS" ]; then
                echo "Discovery pipeline completed successfully."
                echo "================ DISCOVERY METRICS ================"
                echo "$BODY" | grep -o '"sourcesConfigured":\s*[0-9]*' || true
                echo "$BODY" | grep -o '"sourcesChecked":\s*[0-9]*' || true
                echo "$BODY" | grep -o '"candidatesDiscovered":\s*[0-9]*' || true
                echo "$BODY" | grep -o '"duplicatesDetected":\s*[0-9]*' || true
                echo "$BODY" | grep -o '"newCandidatesStaged":\s*[0-9]*' || true
                echo "$BODY" | grep -o '"discoveredAt":\s*"[^"]*"' || true
                echo "==================================================="
                SUCCESS=1
                break
              else
                echo "::error::Discovery API returned 200 but payload indicated failure."
                echo "$BODY"
                exit 1
              fi
            elif [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
              echo "::error::Authentication failed with HTTP $HTTP_STATUS. Please verify SCHEDULER_SECRET."
              exit 1
            else
              echo "::warning::Received HTTP $HTTP_STATUS. Render instance may be warming up. Waiting $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Discovery pipeline failed after $MAX_RETRIES attempts. HTTP Status: $HTTP_STATUS."
            exit 1
          fi
