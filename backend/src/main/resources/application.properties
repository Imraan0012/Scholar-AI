# =============================================================================
# SCHOLAR AI — SPRING BOOT BACKEND CONFIGURATION
# =============================================================================
server.port=${PORT:8000}
spring.application.name=scholar-ai-backend

# Datasource Configuration (Supabase PostgreSQL via Session Pooler or Environment URL)
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Flyway Migrations
spring.flyway.enabled=false

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000}

# Supabase Auth Configuration
# Supabase JWT Secret (optional HMAC signature check; falls back to claims verification if not supplied)
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
